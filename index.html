<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前山牧區事工人員靈修會報名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 列印樣式優化 */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-only { display: block !important; }
            .print-table { width: 100% !important; border-collapse: collapse !important; margin-top: 20px !important; }
            .print-table th, .print-table td { border: 1px solid #000 !important; padding: 12px !important; text-align: left !important; }
            .print-container { box-shadow: none !important; border: none !important; max-width: none !important; width: 100% !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-stone-50 min-h-screen py-6 px-4">

    <div class="max-w-md mx-auto print-container">
        <!-- 網頁顯示標題 (列印隱藏) -->
        <div class="bg-emerald-800 text-white rounded-t-2xl p-6 shadow-lg no-print">
            <h1 class="text-2xl font-bold text-center mb-4">前山牧區事工人員靈修會</h1>
            
            <div class="space-y-3 text-emerald-100 text-sm">
                <div class="flex items-center gap-2 font-bold text-emerald-300">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>日期：5/17（日）08:00-12:00</span>
                </div>
                <div class="flex items-center gap-2 text-yellow-300">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>報名截止：5/14（四）</span>
                </div>
                <div class="bg-emerald-900/40 p-3 rounded-lg border border-emerald-700/50 text-[11px] leading-relaxed opacity-90">
                    <p class="font-bold mb-1 text-emerald-200">參加人員：請本會所有事工人員</p>
                    <p>職務同工、領會、教員、領詩、各詩班、領讀、司琴、謝飯、音控、接待、炊事、接送、打掃、團契幹部、插花……等等。</p>
                </div>
            </div>
        </div>

        <!-- 報名人數統計 (填單完成主要顯示) -->
        <div class="bg-white p-8 border-x border-stone-200 text-center no-print">
            <div class="text-stone-500 text-sm mb-1 font-bold">目前報名總人數</div>
            <div id="mainCountDisplay" class="text-6xl font-black text-emerald-600 mb-2">--</div>
            <p class="text-[10px] text-stone-400">資料已同步至雲端名冊</p>
        </div>

        <!-- 報名輸入區域 (列印隱藏) -->
        <div class="bg-white p-6 shadow-md border-x border-stone-200 no-print border-t border-stone-100">
            <form id="regForm" class="space-y-4">
                <input type="text" id="userName" placeholder="請輸入您的姓名" required
                    class="w-full px-4 py-4 border-2 border-stone-100 rounded-xl focus:border-emerald-500 outline-none transition-all text-xl text-center">
                <button type="submit" id="submitBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md flex items-center justify-center gap-2 active:scale-95 disabled:bg-stone-300">
                    <span id="btnText">提交報名</span>
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                </button>
            </form>
            <div id="statusMsg" class="hidden mt-3 text-center text-xs font-bold py-2 rounded-lg"></div>
        </div>

        <!-- 列印專用抬頭 (平常隱藏) -->
        <div class="print-only mb-6">
            <h1 class="text-3xl font-bold text-center mb-2">前山牧區事工人員靈修會 - 報名名冊</h1>
            <div class="flex justify-between text-sm border-b-2 border-black pb-2">
                <span>日期：5/17 (日) 08:00-12:00</span>
                <span>總人數：<span id="printTotalCount">0</span> 人</span>
            </div>
        </div>

        <!-- 報名名冊區塊 -->
        <div class="bg-white rounded-b-2xl shadow-xl overflow-hidden border border-stone-200">
            <!-- 網頁版名冊標題 (列印隱藏) -->
            <div class="bg-stone-50 px-6 py-4 border-b border-stone-200 flex justify-between items-center no-print">
                <div class="flex items-center gap-2 text-stone-700 font-bold">
                    <i data-lucide="book-open" class="w-5 h-5 text-emerald-600"></i>
                    <span>報名名冊</span>
                </div>
                <button onclick="window.print()" class="text-xs bg-white border border-stone-300 px-3 py-2 rounded-lg flex items-center gap-1.5 hover:bg-stone-100 transition-all shadow-sm">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    列印名冊
                </button>
            </div>

            <!-- 網頁版名單列表 (列印隱藏) -->
            <div id="listContainer" class="divide-y divide-stone-100 min-h-[100px] no-print">
                <!-- 名單 -->
            </div>

            <!-- 列印版專用表格 (平常隱藏) -->
            <div class="print-only">
                <table class="print-table">
                    <thead>
                        <tr>
                            <th style="width: 10%;">編號</th>
                            <th style="width: 40%;">姓名</th>
                            <th style="width: 30%;">報名日期</th>
                            <th style="width: 20%;">簽到</th>
                        </tr>
                    </thead>
                    <tbody id="printTableBody">
                        <!-- 動態填充列印內容 -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-8 text-center text-gray-400 text-[10px] pb-10 no-print">
            真耶穌教會大溪教會職務會 製
        </footer>
    </div>

    <!-- Firebase 腳本 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'daxi-final-v2';

        let registrations = [];
        lucide.createIcons();

        signInAnonymously(auth).catch(console.error);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const dataCol = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');
                onSnapshot(dataCol, (snapshot) => {
                    const newData = [];
                    snapshot.forEach(doc => newData.push({ id: doc.id, ...doc.data() }));
                    // 按時間順序排序（先報名的在前）
                    newData.sort((a, b) => a.timestamp - b.timestamp);
                    registrations = newData;
                    renderUI();
                });
            }
        });

        function renderUI() {
            const container = document.getElementById('listContainer');
            const mainCount = document.getElementById('mainCountDisplay');
            const printTotal = document.getElementById('printTotalCount');
            const printBody = document.getElementById('printTableBody');
            
            mainCount.textContent = registrations.length;
            printTotal.textContent = registrations.length;

            if (registrations.length === 0) {
                container.innerHTML = `<div class="p-10 text-center text-stone-300 italic text-sm">目前尚無報名資料</div>`;
                printBody.innerHTML = `<tr><td colspan="4" style="text-align:center">尚無資料</td></tr>`;
                return;
            }

            // 渲染網頁版列表
            container.innerHTML = registrations.map((reg, idx) => `
                <div class="p-4 flex justify-between items-center bg-white fade-in">
                    <div class="flex items-center gap-4">
                        <span class="text-stone-300 font-mono text-xs w-4">${idx + 1}</span>
                        <div class="font-bold text-stone-800 text-lg">${reg.name}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] text-stone-400">${reg.time}</span>
                        <button onclick="deleteEntry('${reg.id}')" class="text-stone-200 hover:text-red-500 p-2 transition-colors">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).reverse().join(''); // 網頁版顯示最新報名在最上

            // 渲染列印版表格
            printBody.innerHTML = registrations.map((reg, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td style="font-weight:bold">${reg.name}</td>
                    <td>${reg.date || reg.time.split(' ')[0]}</td>
                    <td></td>
                </tr>
            `).join('');

            lucide.createIcons();
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('userName');
            const name = input.value.trim();
            if (!name || !auth.currentUser) return;

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
            const timeStr = `${dateStr} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const docId = Date.now().toString();

            input.value = '';
            showStatus("報名提交成功！", "bg-green-100", "text-green-700");

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registrations', docId), {
                    name, 
                    time: timeStr, 
                    date: dateStr,
                    timestamp: Date.now()
                });
            } catch (err) {
                showStatus("提交失敗，請檢查網路", "bg-red-100", "text-red-700");
            }
        });

        window.deleteEntry = async (id) => {
            if(!confirm("確定移除此報名記錄？")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registrations', id));
        };

        function showStatus(msg, bg, text) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = `mt-3 text-center text-xs font-bold py-2 rounded-lg fade-in ${bg} ${text}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
