<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前山牧區事工人員靈修會報名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-only { display: block !important; }
            .print-table { width: 100% !important; border-collapse: collapse !important; margin-top: 20px !important; }
            .print-table th, .print-table td { border: 1px solid #000 !important; padding: 10px !important; text-align: left !important; }
            .print-container { box-shadow: none !important; border: none !important; max-width: none !important; width: 100% !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-stone-100 min-h-screen py-4 px-3 sm:py-8 sm:px-6 text-slate-800">

    <div class="max-w-md mx-auto print-container">
        <!-- 標題區域 -->
        <div class="bg-emerald-800 text-white rounded-t-2xl p-6 shadow-lg no-print">
            <h1 class="text-2xl font-bold text-center mb-3 text-white">前山牧區事工人員靈修會</h1>
            <div class="space-y-2 text-emerald-100 text-xs sm:text-sm">
                <div class="flex items-center gap-2 font-bold text-emerald-300">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>5/17（日）08:00-12:00</span>
                </div>
                <div class="flex items-center gap-2 text-yellow-300">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>截止日期：5/14（四）</span>
                </div>
                <div class="bg-emerald-900/40 p-3 rounded-lg text-[11px] leading-relaxed border border-emerald-700/30">
                    <p class="font-bold mb-1 text-emerald-200">參加對象：請本會所有事工人員</p>
                    <p class="opacity-80 leading-relaxed">職務同工、領會、教員、領詩、各詩班、領讀、司琴、謝飯、音控、接待、炊事、接送、打掃、團契幹部、插花……等等。</p>
                </div>
            </div>
        </div>

        <!-- 統計與連線狀態 -->
        <div class="bg-white px-6 py-8 border-x border-stone-200 text-center no-print relative shadow-sm">
            <div id="connBadge" class="absolute top-3 right-4 flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold bg-stone-100 text-stone-400 transition-all">
                <span id="connDot" class="w-2 h-2 rounded-full bg-stone-300"></span>
                <span id="connLabel">載入中</span>
            </div>
            <div class="text-stone-400 text-xs font-bold tracking-widest mb-1">目前報名總人數</div>
            <div id="mainCountDisplay" class="text-7xl font-black text-emerald-600 mb-1 tabular-nums">0</div>
            <div id="statusMsg" class="h-4 text-[11px] font-medium text-emerald-500"></div>
        </div>

        <!-- 輸入區域 -->
        <div class="bg-white p-6 shadow-md border-x border-stone-200 no-print border-t border-stone-50">
            <form id="regForm" class="space-y-3">
                <input type="text" id="userName" placeholder="請輸入姓名" required
                    class="w-full px-4 py-4 border-2 border-stone-100 rounded-xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-50/30 outline-none transition-all text-xl text-center font-bold">
                <button type="submit" id="submitBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all">
                    <span>提交報名</span>
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </form>
        </div>

        <!-- 列印抬頭 -->
        <div class="print-only mb-6 text-center border-b-4 border-emerald-800 pb-4">
            <h1 class="text-3xl font-bold mb-1">前山牧區事工人員靈修會 - 報名名冊</h1>
            <p class="text-sm">時間：5/17 (日) 08:00-12:00 | 總人數：<span id="printTotalCount">0</span> 人</p>
        </div>

        <!-- 名冊區域 -->
        <div class="bg-white rounded-b-2xl shadow-xl border border-stone-200 overflow-hidden">
            <div class="bg-stone-50 px-6 py-4 border-b border-stone-200 flex justify-between items-center no-print">
                <div class="flex items-center gap-2 text-stone-700 font-bold">
                    <i data-lucide="clipboard-list" class="w-5 h-5 text-emerald-600"></i>
                    <span>詳細名冊</span>
                </div>
                <button onclick="window.print()" class="text-xs bg-white border border-stone-200 px-3 py-2 rounded-lg flex items-center gap-1.5 hover:bg-stone-50 transition-all font-medium">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    列印名冊
                </button>
            </div>

            <div id="listContainer" class="divide-y divide-stone-50 max-h-[400px] overflow-y-auto no-print">
                <!-- 名單 -->
            </div>

            <div class="print-only p-4">
                <table class="print-table">
                    <thead>
                        <tr>
                            <th style="width: 10%;">編號</th>
                            <th style="width: 40%;">姓名</th>
                            <th style="width: 30%;">報名日期</th>
                            <th style="width: 20%;">簽到</th>
                        </tr>
                    </thead>
                    <tbody id="printTableBody"></tbody>
                </table>
            </div>
        </div>

        <footer class="mt-8 text-center text-stone-400 text-[10px] tracking-widest pb-10 no-print">
            真耶穌教會大溪教會職務會 製
        </footer>
    </div>

    <script type="module">
        // --- 設定區 ---
        // 請將您的 Google Apps Script 部署網址貼在下方引號內
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZWVK2xcO3CzWtJcXcbXtKrncVVM8cwfJX6oYxN2VDLu6QeyTqm1RPkmeN1J5RzIY66g/exec"; 
        // --------------

        const APP_ID = 'daxi-stable-v5';
        const CACHE_KEY = `daxi_data_${APP_ID}`;
        
        let registrations = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");

        // 介面元素
        const mainCount = document.getElementById('mainCountDisplay');
        const printTotal = document.getElementById('printTotalCount');
        const container = document.getElementById('listContainer');
        const printBody = document.getElementById('printTableBody');
        const connLabel = document.getElementById('connLabel');
        const connDot = document.getElementById('connDot');

        // 初始渲染 (秒開)
        lucide.createIcons();
        renderUI();
        checkConnection();

        // 檢查連線狀態並嘗試從 Google Sheet 同步
        async function checkConnection() {
            if (!GOOGLE_SCRIPT_URL) {
                setConnStatus('local');
                return;
            }

            setConnStatus('syncing');
            try {
                // 嘗試獲取最新名單
                const response = await fetch(GOOGLE_SCRIPT_URL);
                if (response.ok) {
                    const cloudData = await response.json();
                    if (Array.isArray(cloudData)) {
                        registrations = cloudData;
                        localStorage.setItem(CACHE_KEY, JSON.stringify(registrations));
                        renderUI();
                    }
                    setConnStatus('online');
                } else {
                    setConnStatus('error');
                }
            } catch (err) {
                console.error("Fetch failed:", err);
                setConnStatus('error');
            }
        }

        function renderUI() {
            mainCount.textContent = registrations.length;
            printTotal.textContent = registrations.length;

            if (registrations.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-stone-300 italic text-sm">目前無人報名</div>`;
                printBody.innerHTML = ``;
                return;
            }

            container.innerHTML = [...registrations].reverse().map((reg, idx) => `
                <div class="p-4 flex justify-between items-center bg-white hover:bg-stone-50 transition-colors fade-in border-b border-stone-50">
                    <div class="flex items-center gap-4">
                        <span class="text-stone-300 font-mono text-[10px] w-6 text-center">${registrations.length - idx}</span>
                        <div class="font-bold text-stone-800 text-lg">${reg.name}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] text-stone-400 tracking-tighter">${reg.time}</span>
                        <button onclick="deleteEntry('${reg.id}')" class="text-stone-200 hover:text-red-400 p-2 transition-colors no-print">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            printBody.innerHTML = registrations.map((reg, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td style="font-weight:bold">${reg.name}</td>
                    <td>${reg.date || reg.time.split(' ')[0]}</td>
                    <td></td>
                </tr>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }

        // 提交
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('userName');
            const name = input.value.trim();
            if (!name) return;

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
            const timeStr = `${dateStr} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const docId = Date.now().toString();

            const newReg = { id: docId, name, time: timeStr, date: dateStr, timestamp: Date.now() };
            
            // 樂觀更新 (立即顯示)
            registrations.push(newReg);
            renderUI();
            input.value = '';
            showStatus("感謝主！你已報名完成。願神記念並越事奉越甘甜！");

            // 同步到 Google Sheet
            if (GOOGLE_SCRIPT_URL) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // 重要：避免跨網域問題
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newReg)
                    });
                    setConnStatus('online');
                } catch (err) {
                    console.error("Save to Google Sheet failed");
                    setConnStatus('error');
                }
            }
            
            localStorage.setItem(CACHE_KEY, JSON.stringify(registrations));
        });

        window.deleteEntry = async (id) => {
            if(!confirm("確定移除這筆報名記錄？")) return;
            registrations = registrations.filter(r => r.id !== id);
            renderUI();
            
            if (GOOGLE_SCRIPT_URL) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ action: 'DELETE', id: id })
                    });
                } catch (e) {}
            }
            localStorage.setItem(CACHE_KEY, JSON.stringify(registrations));
        };

        function setConnStatus(status) {
            const badge = connLabel.parentElement;
            if (status === 'online') {
                connDot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_5px_#10b981]";
                connLabel.textContent = "已連線試算表";
                badge.className = "absolute top-3 right-4 flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100 transition-all";
            } else if (status === 'syncing') {
                connDot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse";
                connLabel.textContent = "同步中";
                badge.className = "absolute top-3 right-4 flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold bg-yellow-50 text-yellow-600 border border-yellow-100 transition-all";
            } else if (status === 'local') {
                connDot.className = "w-2 h-2 rounded-full bg-stone-300";
                connLabel.textContent = "⚠️ 尚未連結試算表";
                badge.className = "absolute top-3 right-4 flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold bg-stone-50 text-stone-400 border border-stone-200 transition-all cursor-help";
                badge.title = "請在程式碼中填入 GOOGLE_SCRIPT_URL 網址。";
            } else {
                connDot.className = "w-2 h-2 rounded-full bg-red-400";
                connLabel.textContent = "連線異常";
                badge.className = "absolute top-3 right-4 flex items-center gap-1.5 px-2 py-1 rounded-full text-[10px] font-bold bg-red-50 text-red-500 border border-red-100 transition-all";
            }
        }

        function showStatus(msg) {
            const el = document.getElementById('statusMsg');
            el.innerHTML = `<div class="fade-in">${msg}</div>`;
            setTimeout(() => el.innerHTML = "", 5000);
        }
    </script>
</body>
</html>
