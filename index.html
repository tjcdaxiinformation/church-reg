
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前山牧區事工人員靈修會報名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* 列印專用樣式 */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white !important; padding: 0 !important; }
            .print-container { box-shadow: none !important; border: none !important; width: 100% !important; max-width: none !important; }
            .list-item { border-bottom: 1px solid #eee !important; page-break-inside: avoid; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-stone-100 min-h-screen py-6 px-4">

    <div class="max-w-md mx-auto print-container">
        <!-- 標題區域 -->
        <div class="bg-emerald-800 text-white rounded-t-2xl p-6 shadow-lg relative overflow-hidden">
            <h1 class="text-2xl font-bold text-center mb-4">前山牧區事工人員靈修會</h1>
            
            <div class="space-y-3 text-emerald-100 text-sm">
                <div class="flex items-center gap-2">
                    <i data-lucide="calendar" class="w-4 h-4 text-emerald-300"></i>
                    <span class="font-bold">日期：5/17（日）08:00-12:00</span>
                </div>
                <div class="flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4 text-emerald-300"></i>
                    <span class="font-bold">報名截止：5/14（四）</span>
                </div>
                <div class="bg-emerald-900/50 p-3 rounded-lg border border-emerald-700/50">
                    <p class="font-bold mb-1 text-emerald-200">參加人員：請本會所有事工人員</p>
                    <p class="text-[12px] leading-relaxed opacity-90">
                        職務同工、領會人員、宗教教育教員、領詩、各詩班成員、領讀、司琴、謝飯、音控、接待、炊事人員、接送、打掃組別、團契幹部、插花……等等。
                    </p>
                </div>
            </div>
        </div>

        <!-- 報名輸入區域 (列印時隱藏) -->
        <div class="bg-white p-6 shadow-md border-x border-stone-200 no-print">
            <form id="regForm" class="space-y-4">
                <div class="relative">
                    <input type="text" id="userName" placeholder="請輸入姓名報名" required
                        class="w-full px-4 py-4 border-2 border-stone-200 rounded-xl focus:border-emerald-500 outline-none transition-all text-lg shadow-sm">
                    <i data-lucide="user" class="absolute right-4 top-4 text-stone-300 w-6 h-6"></i>
                </div>
                <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 active:scale-95">
                    <span>立即提交報名</span>
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                </button>
            </form>
            <div id="statusMsg" class="hidden mt-4 p-3 rounded-xl bg-green-50 text-green-700 text-center text-sm font-bold border border-green-200">
                報名成功！
            </div>
        </div>

        <!-- 列印專用的抬頭 (平常隱藏) -->
        <div class="print-only bg-white p-6 text-center border-b-2 border-black">
            <h1 class="text-3xl font-bold mb-2">前山牧區事工人員靈修會 - 報名名冊</h1>
            <p class="text-lg">日期：5/17（日） 08:00-12:00</p>
        </div>

        <!-- 報名名單顯示 -->
        <div class="bg-white rounded-b-2xl shadow-xl overflow-hidden border border-stone-200 min-h-[300px]">
            <div class="bg-stone-50 px-6 py-4 border-b border-stone-200 flex justify-between items-center no-print">
                <div class="flex items-center gap-2 text-stone-700 font-bold">
                    <i data-lucide="users" class="w-5 h-5 text-emerald-600"></i>
                    <span>已報名名單</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="text-xs bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 hover:bg-emerald-100">
                        <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                        列印名單
                    </button>
                    <span id="countTag" class="bg-emerald-600 text-white text-xs px-2.5 py-1 rounded-full font-bold">
                        0 人
                    </span>
                </div>
            </div>

            <div id="listContainer" class="divide-y divide-stone-100">
                <!-- 名單會在此快速產生 -->
            </div>
        </div>

        <!-- 管理功能 (列印時隱藏) -->
        <div class="mt-4 flex justify-between px-2 no-print">
            <button onclick="clearAllData()" class="text-[10px] text-stone-400 hover:text-red-500 flex items-center gap-1">
                <i data-lucide="trash" class="w-3 h-3"></i> 清除本機所有資料
            </button>
            <p class="text-[10px] text-stone-400">真耶穌教會大溪教會職務會 製</p>
        </div>
    </div>

    <script>
        // 初始化圖示
        lucide.createIcons();

        const regForm = document.getElementById('regForm');
        const userNameInput = document.getElementById('userName');
        const listContainer = document.getElementById('listContainer');
        const countTag = document.getElementById('countTag');
        const statusMsg = document.getElementById('statusMsg');

        // 使用本機儲存，保證秒開秒存
        let registrations = JSON.parse(localStorage.getItem('daxi_instant_reg') || '[]');

        function renderList() {
            countTag.textContent = `${registrations.length} 人`;
            
            if (registrations.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-16 text-center text-stone-300">
                        <i data-lucide="edit-3" class="w-12 h-12 mx-auto mb-2 opacity-20"></i>
                        <p class="text-sm italic">尚無報名資料</p>
                    </div>`;
            } else {
                listContainer.innerHTML = registrations.map((reg, index) => `
                    <div class="p-4 flex justify-between items-center bg-white list-item">
                        <div class="flex items-center gap-4">
                            <span class="text-stone-300 font-mono text-xs">${registrations.length - index}</span>
                            <div class="w-10 h-10 bg-stone-100 rounded-full flex items-center justify-center font-bold text-emerald-800">
                                ${reg.name.substring(0, 1)}
                            </div>
                            <div>
                                <div class="font-bold text-stone-800 text-lg">${reg.name}</div>
                                <div class="text-[10px] text-stone-400 no-print">${reg.time} 登記</div>
                            </div>
                        </div>
                        <button onclick="removeName(${reg.id})" class="no-print text-stone-200 hover:text-red-500 p-2">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        regForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = userNameInput.value.trim();
            if (!name) return;

            const now = new Date();
            const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const newEntry = {
                id: Date.now(),
                name: name,
                time: timeStr
            };

            // 放到名單最前面
            registrations.unshift(newEntry);
            localStorage.setItem('daxi_instant_reg', JSON.stringify(registrations));
            
            userNameInput.value = '';
            renderList();

            // 顯示成功動畫
            statusMsg.classList.remove('hidden');
            setTimeout(() => statusMsg.classList.add('hidden'), 2000);
        });

        window.removeName = function(id) {
            if(!confirm("確定要移除這筆名單嗎？")) return;
            registrations = registrations.filter(r => r.id !== id);
            localStorage.setItem('daxi_instant_reg', JSON.stringify(registrations));
            renderList();
        }

        window.clearAllData = function() {
            if(!confirm("警告：這將會刪除此裝置上所有的報名資料，確定嗎？")) return;
            registrations = [];
            localStorage.removeItem('daxi_instant_reg');
            renderList();
        }

        // 初始載入
        renderList();
    </script>
</body>
</html>

```
